name: Threat Intelligence & Wordlist Audit

on:
  schedule:
    # Run automatically every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Maximum candidate paths to evaluate'
        required: false
        default: '2000'
        type: string
      custom_url:
        description: 'Optional custom wordlist URL'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit Threat Intelligence against Section 6.3
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Apache2 HTTPD & Modules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2

      - name: Validate .htaccess Syntax
        run: |
          chmod +x scripts/test-syntax.sh
          ./scripts/test-syntax.sh

      - name: Run Threat Intelligence Miner
        id: miner
        run: |
          chmod +x scripts/mine-threat-intel.py
          
          MAX_CANDIDATES="${{ inputs.max_candidates || '2000' }}"
          CUSTOM_URL="${{ inputs.custom_url || '' }}"
          
          CMD="python3 scripts/mine-threat-intel.py --max-candidates ${MAX_CANDIDATES}"
          if [ -n "${CUSTOM_URL}" ]; then
            CMD="${CMD} --url ${CUSTOM_URL}"
          else
            CMD="${CMD} --fetch-seclists"
          fi
          
          echo "Executing: ${CMD}"
          ${CMD} | tee audit_output.txt

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🛡️ Threat Intelligence Wordlist Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f audit_output.txt ]; then
            cat audit_output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No audit output generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
