name: Syntax & Configuration Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate .htaccess Syntax & Delimiters
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Apache2 HTTPD & Modules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2

      - name: Run Syntax & Tokenizer Test Suite
        run: |
          chmod +x scripts/test-syntax.sh
          ./scripts/test-syntax.sh
